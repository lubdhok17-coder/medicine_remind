name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup Java JDK
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.22.0'
        channel: 'stable'

    - name: Get Dependencies
      run: flutter pub get

    - name: Fix Android v2 Embedding & Update Kotlin Version
      run: |
        flutter create . --org com.example --project-name medi_reminder --platforms=android
        sed -i 's/ext.kotlin_version = .*/ext.kotlin_version = "1.9.20"/' android/build.gradle || true

    - name: Build APK
      run: flutter build apk --release --no-pub

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: medi-reminder-apk
        path: build/app/outputs/flutter-apk/app-release.apk
